# Temporary maintainer workflow to regenerate complete third-party notices
# after pinning the previously missing browser crates. Delete after success.
name: one-shot-browser-notices-sync

on:
  push:
    branches: [work/pr0-browser-ci-foundation]
    paths: [.github/workflows/one-shot-browser-notices-sync.yml]

permissions:
  contents: write

jobs:
  refresh-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted PR branch with bundled native sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/pr0-browser-ci-foundation
          submodules: recursive
          persist-credentials: true

      - name: Rust 1.95
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0

      - name: Install Bun 1.4.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install official cargo-about 0.9.3
        shell: bash
        run: cargo install --locked cargo-about --version 0.9.3

      - name: Regenerate complete third-party license notices
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          bun scripts/notices.ts
          test -s THIRD-PARTY-NOTICES
          grep -q "gpui-wry" THIRD-PARTY-NOTICES
          grep -q "lb-wry" THIRD-PARTY-NOTICES
          git diff --check
          git diff --stat -- THIRD-PARTY-NOTICES

      - name: Commit reviewed generator output to PR branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short THIRD-PARTY-NOTICES)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD-PARTY-NOTICES
          git commit -m "docs(licenses): regenerate notices for pinned browser dependencies"
          git push origin HEAD:refs/heads/work/pr0-browser-ci-foundation
