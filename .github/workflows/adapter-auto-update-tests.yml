name: adapter-auto-update-tests
on:
  pull_request:
    paths:
      - scripts/adapter_update.py
      - scripts/test_adapter_update.py
      - .github/workflows/adapter-auto-update.yml
      - .github/workflows/adapter-auto-update-tests.yml
      - .github/workflows/browser-macos.yml
      - scripts/test_adapter_pipeline_contract.py
      - scripts/webview_branch_protection.py
      - scripts/test_webview_branch_protection.py
      - scripts/configure_branch_protection.py
      - scripts/test_configure_branch_protection.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test SHA pinning, versioning, checked source and fail-closed CI
        run: |
          python3 -m unittest discover -s scripts -p 'test_adapter_update.py' -v
          python3 -m unittest discover -s scripts -p 'test_adapter_pipeline_contract.py' -v
          python3 -m unittest discover -s scripts -p 'test_webview_branch_protection.py' -v
          python3 -m unittest discover -s scripts -p 'test_configure_branch_protection.py' -v
