name: webview-release-gate-tests

on:
  pull_request:
    paths:
      - scripts/webview_release_gate.py
      - scripts/test_webview_release_gate.py
      - .github/workflows/webview-auto-release.yml
      - .github/workflows/webview-release-gate-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-release-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fail-closed rules and CI result precedence
        run: python3 -m unittest discover -s scripts -p 'test_webview_release_gate.py' -v
