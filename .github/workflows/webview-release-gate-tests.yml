name: webview-release-gate-tests

on:
  pull_request:
    paths:
      - scripts/webview_release_gate.py
      - scripts/test_webview_release_gate.py
      - scripts/webview_release_identity.py
      - scripts/test_webview_release_identity.py
      - scripts/webview_workflow_attestation.py
      - scripts/test_webview_workflow_attestation.py
      - scripts/webview_branch_protection.py
      - scripts/test_webview_branch_protection.py
      - .github/workflows/browser-macos.yml
      - .github/workflows/ci.yml
      - .github/workflows/webview-auto-release.yml
      - .github/workflows/webview-release-gate-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-release-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fail-closed rules and CI result precedence
        run: |
          python3 -m unittest discover -s scripts -p 'test_webview_release_gate.py' -v
          python3 -m unittest discover -s scripts -p 'test_webview_release_identity.py' -v
          python3 -m unittest discover -s scripts -p 'test_webview_workflow_attestation.py' -v
          python3 -m unittest discover -s scripts -p 'test_webview_branch_protection.py' -v
      - name: Checkout tested integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/native-browser-tabs
          path: maintained-integration
          persist-credentials: false
      - name: Verify actual trusted platform/native E2E parity
        run: |
          python3 scripts/webview_workflow_attestation.py \
            --trusted-ci .github/workflows/ci.yml \
            --tested-ci maintained-integration/.github/workflows/ci.yml \
            --trusted-browser .github/workflows/browser-macos.yml \
            --tested-browser maintained-integration/.github/workflows/browser-macos.yml
