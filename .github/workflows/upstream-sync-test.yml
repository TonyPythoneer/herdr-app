name: upstream-sync-tests

on:
  pull_request:
    paths:
      - .github/workflows/upstream-sync.yml
      - .github/workflows/upstream-sync-test.yml
      - scripts/upstream_sync.py
      - scripts/test_upstream_sync.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit test stable tag selection and idempotent branch naming
        run: python3 -m unittest discover -s scripts -p 'test_upstream_sync.py' -v
