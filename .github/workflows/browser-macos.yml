name: browser-macos

on:
  push:
    branches: [feature/native-browser-tabs]
  pull_request:
    branches: [feature/native-browser-tabs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-macos-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/native-browser-tabs' }}

jobs:
  # Only Markdown/MDX-only PRs or pushes get a fast successful required check.
  # Executable/scripts/config in docs/ still trigger the full macOS validation.
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for code/CI changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]] ||
             [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}" ||
             ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          if [[ ! -s "$RUNNER_TEMP/changed.txt" ]]; then
            build=false
          elif grep -Eqv '(^|/)[^/]+\.(md|mdx)$' "$RUNNER_TEMP/changed.txt"; then
            build=true
          else
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Browser build required: $build"
          cat "$RUNNER_TEMP/changed.txt"

  browser-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout upstream-derived fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Rust 1.95 (upstream pinned)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - name: Zig 0.16 (required by upstream ghostty-sys)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Restore Rust build cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: browser-rust-v2-macos-aarch64-rust195-zig016-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'vendor/**', 'crates/**', '.github/workflows/browser-macos.yml') }}
          restore-keys: browser-rust-v2-macos-aarch64-rust195-zig016-
      - name: Restore vendored source timestamps
        run: scripts/ci-sources restore
      - name: Verify committed browser Cargo.lock is complete
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Compile test binaries
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --no-run
      - name: Require installed Google Chrome for real CDP tests
        run: |
          set -euo pipefail
          binary='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          if [[ ! -x "$binary" ]]; then
            echo "::error::Google Chrome must be installed on this runner for the required Chrome CDP test"
            exit 1
          fi
          "$binary" --version
      - name: Rust unit and Chrome CDP integration tests
        env:
          HERDR_CHROME_E2E: "1"
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --bins
      - name: Native macOS screenshot tests
        env:
          HERDR_SHOT_NATIVE_TEST: "1"
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test shot_pixels
      - name: Real GPUI/WKWebView child snapshot pixels (native AppKit)
        env:
          HERDR_WK_NATIVE_SMOKE: "1"
        run: |
          set -euo pipefail
          cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test wk_native_pixels 2>&1 | tee "$RUNNER_TEMP/wk-snapshot.log"
          grep -Fq 'native WKWebView screenshot pixel test passed:' "$RUNNER_TEMP/wk-snapshot.log"
      - name: Proof of trusted native WKWebView input in a visible child window
        env:
          HERDR_WK_NATIVE_INPUT_E2E: "1"
        run: |
          set -euo pipefail
          cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test wk_native_input 2>&1 | tee "$RUNNER_TEMP/wk-trusted-input.log"
          grep -Fq 'WK_TRUSTED_INPUT_VERIFIED: native click had isTrusted=true' "$RUNNER_TEMP/wk-trusted-input.log"
          grep -Fq 'WK_TRUSTED_KEY_VERIFIED: AppKit keyDown had isTrusted=true' "$RUNNER_TEMP/wk-trusted-input.log"
          grep -Fq 'WK_TRUSTED_TEXT_VERIFIED: native AppKit text produced trusted keydown and input value' "$RUNNER_TEMP/wk-trusted-input.log"
          grep -Fq 'WK_TRUSTED_WHEEL_VERIFIED: native wheel isTrusted=true and page scrollY advanced' "$RUNNER_TEMP/wk-trusted-input.log"
      - name: Build macOS app through upstream packaging
        env:
          HERDR_BROWSER_FORK: "1"
        run: scripts/package
      - name: Assemble Apple Silicon DMG
        run: |
          set -euo pipefail
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          app='dist/Herdr WebView.app'
          test -f "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = 'Herdr WebView'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'dev.herdr.webview'
          cmp assets/icons/Herdr.icns "$app/Contents/Resources/Herdr.icns"
          codesign --verify --deep --strict "$app"
          mkdir -p dist/dmg-root
          ditto "$app" 'dist/dmg-root/Herdr WebView.app'
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname 'Herdr WebView' -srcfolder dist/dmg-root -format UDZO -ov dist/Herdr-Browser-macos-arm64.dmg
          test -s dist/Herdr-Browser-macos-arm64.dmg
      - name: Verify fork release archive and produce pinned update manifest
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_webview_release_manifest.py' -v
          python3 scripts/webview_release_manifest.py \
            --archive dist/herdr-app-macos-aarch64.tar.gz \
            --dmg dist/Herdr-Browser-macos-arm64.dmg \
            --original-icon assets/icons/Herdr.icns \
            --output dist/latest.json
          test -s dist/latest.json
      - name: Upload verified updater assets (Actions artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-WebView-updater-assets
          path: |
            dist/herdr-app-macos-aarch64.tar.gz
            dist/latest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-Browser-macos-arm64
          path: dist/Herdr-Browser-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
      # Stable GitHub Releases are gated by the full dual-engine E2E and fork
      # updater package/manifest work; do not publish on each feature push.
      - name: Record vendored source timestamps
        if: success() && env.SAVE_CACHES == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - name: Save Rust cache only after a successful trusted cache miss
        if: success() && env.SAVE_CACHES == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Cache summary
        if: always()
        run: |
          echo "### Browser macOS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache hit: ${{ steps.browser-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache write permitted: ${{ env.SAVE_CACHES }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DMG: Actions artifact only; stable release disabled until both real browser backends pass E2E" >> "$GITHUB_STEP_SUMMARY"

  # Stable required status: green for docs-only, red for any mandatory build
  # failure. A skipped heavy job must never hide a failed code build.
  browser-ci:
    name: Browser CI required check
    needs: [changes, browser-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce browser check result
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          BUILD_RESULT: ${{ needs.browser-macos.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]] || exit 1
          if [[ "$BUILD_REQUIRED" == true ]]; then
            [[ "$BUILD_RESULT" == success ]] || exit 1
          else
            [[ "$BUILD_RESULT" == skipped ]] || exit 1
          fi


  # Actual packaged-app E2E, not the isolated GPUI/WK fixture in the build job.
  # Uses the official herdr-core in a disposable HOME and a loopback fixture.
  # Both browser engines must work through the shipped CLI and stdio MCP.
  wkwebview-native-e2e:
    name: wkwebview-native-e2e
    needs: [changes, browser-macos]
    if: needs.changes.outputs.build == 'true' && needs.browser-macos.result == 'success'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the actual updater archive from this same workflow run
        uses: actions/download-artifact@v4
        with:
          name: Herdr-WebView-updater-assets
          path: dist
      - name: Extract and verify the shipped binary and signed app
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          app='dist/Herdr WebView.app'
          test -x "$app/Contents/MacOS/Herdr"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'dev.herdr.webview'
          cmp assets/icons/Herdr.icns "$app/Contents/Resources/Herdr.icns"
          "$app/Contents/MacOS/Herdr" --version
      - name: Install real official herdr-core in an ephemeral location
        shell: bash
        run: |
          set -euo pipefail
          core_dir="$RUNNER_TEMP/webview-e2e-core"
          mkdir -p "$core_dir"
          curl -fsSL --retry 3 https://releases.herdr.dev/core/install.sh -o "$RUNNER_TEMP/herdr-core-install.sh"
          HC_INSTALL_DIR="$core_dir" sh "$RUNNER_TEMP/herdr-core-install.sh"
          core="$core_dir/herdr-core"
          if [[ ! -x "$core" ]]; then core="$core_dir/hc"; fi
          test -x "$core"
          "$core" --version | grep '^hc '
          echo "WEBVIEW_E2E_CORE=$core" >> "$GITHUB_ENV"
      - name: Real Herdr WebView packaged WKWebView browser via CLI and MCP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/webview_packaged_e2e.py \
            --app 'dist/Herdr WebView.app/Contents/MacOS/Herdr' \
            --core "$WEBVIEW_E2E_CORE" --engine wkwebview \
            2>&1 | tee "$RUNNER_TEMP/packaged-wk-e2e.log"
          grep -Fq 'PACKAGED_BROWSER_E2E_VERIFIED: wkwebview complete' "$RUNNER_TEMP/packaged-wk-e2e.log"
          grep -Fq 'PACKAGED_MCP_VERIFIED:' "$RUNNER_TEMP/packaged-wk-e2e.log"
      - name: Real Herdr WebView packaged Chrome CDP browser via CLI and MCP
        shell: bash
        run: |
          set -euo pipefail
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          python3 scripts/webview_packaged_e2e.py \
            --app 'dist/Herdr WebView.app/Contents/MacOS/Herdr' \
            --core "$WEBVIEW_E2E_CORE" --engine chrome-cdp \
            2>&1 | tee "$RUNNER_TEMP/packaged-chrome-e2e.log"
          grep -Fq 'PACKAGED_BROWSER_E2E_VERIFIED: chrome-cdp complete' "$RUNNER_TEMP/packaged-chrome-e2e.log"


  # Real GPUI approval. An independent macOS process sends OS UI input into
  # the *packaged* app's live approval dialog, not a debug API or mock callback.
  # Both allowed and denied actions must have observable DOM postconditions.
  browser-gpui-approval-e2e:
    name: browser-gpui-approval-e2e
    needs: [changes, browser-macos]
    if: needs.changes.outputs.build == 'true' && needs.browser-macos.result == 'success'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the real macOS App package
        uses: actions/download-artifact@v4
        with:
          name: Herdr-WebView-updater-assets
          path: dist
      - name: Verify the real macOS app and prepare native OS input driver
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          app='dist/Herdr WebView.app'
          test -x "$app/Contents/MacOS/Herdr"
          codesign --verify --deep --strict "$app"
          swiftc -O -o "$RUNNER_TEMP/herdr-native-approval-driver" \
            scripts/webview_gpui_approval_driver.swift
          test -x "$RUNNER_TEMP/herdr-native-approval-driver"
      - name: Install official herdr-core into a disposable test home
        shell: bash
        run: |
          set -euo pipefail
          core_dir="$RUNNER_TEMP/webview-gpui-e2e-core"
          mkdir -p "$core_dir"
          curl -fsSL --retry 3 https://releases.herdr.dev/core/install.sh -o "$RUNNER_TEMP/herdr-core-install.sh"
          HC_INSTALL_DIR="$core_dir" sh "$RUNNER_TEMP/herdr-core-install.sh"
          core="$core_dir/herdr-core"
          if [[ ! -x "$core" ]]; then core="$core_dir/hc"; fi
          test -x "$core"
          "$core" --version | grep '^hc '
          echo "WEBVIEW_E2E_CORE=$core" >> "$GITHUB_ENV"
      - name: Actual GPUI approval and denial in packaged WKWebView
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/webview_packaged_e2e.py \
            --app 'dist/Herdr WebView.app/Contents/MacOS/Herdr' \
            --core "$WEBVIEW_E2E_CORE" --engine wkwebview \
            --approval-driver "$RUNNER_TEMP/herdr-native-approval-driver" \
            2>&1 | tee "$RUNNER_TEMP/approval-wk-e2e.log"
          grep -Fq 'PACKAGED_GPUI_APPROVAL_E2E_VERIFIED:' "$RUNNER_TEMP/approval-wk-e2e.log"
      - name: Actual GPUI approval and denial in packaged Chrome CDP
        shell: bash
        run: |
          set -euo pipefail
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          python3 scripts/webview_packaged_e2e.py \
            --app 'dist/Herdr WebView.app/Contents/MacOS/Herdr' \
            --core "$WEBVIEW_E2E_CORE" --engine chrome-cdp \
            --approval-driver "$RUNNER_TEMP/herdr-native-approval-driver" \
            2>&1 | tee "$RUNNER_TEMP/approval-chrome-e2e.log"
          grep -Fq 'PACKAGED_GPUI_APPROVAL_E2E_VERIFIED:' "$RUNNER_TEMP/approval-chrome-e2e.log"
